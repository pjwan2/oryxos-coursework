server:
  address: 127.0.0.1  # local course demo only; do not expose unauthenticated APIs
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: oryxos
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ORYXOS_JDBC_URL:jdbc:sqlite:./oryxos-dev.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  sql:
    init:
      # The schema is owned by SqliteMigrator (oryxos-storage), which runs before any other bean.
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: never
    prometheus:
      access: read-only
  prometheus:
    metrics:
      export:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  structured:
    format:
      console: logstash

# Only the local mock model is active by default. DeepSeek is enabled when an API key exists.
oryxos:
  database:
    backup-before-migrate: true   # VACUUM INTO a .bak and rehearse on a copy before upgrading a file
  scheduler:
    enabled: ${ORYXOS_SCHEDULER_ENABLED:true}
    pool-size: 4
  profile-directory: ${ORYXOS_PROFILE_DIR:.oryxos/profiles}
  providers:
    - name: mock
      type: mock
      model: mock-echo
    - name: deepseek
      type: openai-compatible
      model: deepseek-chat
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
  # Long-term memory (lesson 21/22). backend: markdown (default) | sqlite | mem0
  memory:
    backend: ${ORYXOS_MEMORY_BACKEND:markdown}
    markdown-path: ${ORYXOS_MEMORY_FILE:.oryxos/memory/MEMORY.md}
    archival-max-entries: 100
    archival-max-chars: 4000
    # mem0-base-url: http://localhost:8000   # only when backend=mem0 (unverified against real Mem0)
    # mem0-user-id: oryxos
    # mem0-api-key: ${MEM0_API_KEY:}
